# Temporary: drives the published site in a real browser to confirm it boots,
# logs no errors and can open a camera. Run manually, then removed.
name: Live site check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm init -y && npm i playwright@1.49.1 && npx playwright install --with-deps chromium

      - name: Drive the published site
        run: |
          cat > check.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({
              args: ['--use-fake-ui-for-media-stream', '--use-fake-device-for-media-stream',
                     '--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader']
            });
            const page = await (await browser.newContext({
              viewport: { width: 390, height: 780 }, permissions: ['camera']
            })).newPage();
            const bad = [];
            page.on('console', m => { if (m.type() === 'error') bad.push('console: ' + m.text().slice(0, 200)); });
            page.on('pageerror', e => bad.push('pageerror: ' + e.message));
            page.on('response', r => { if (r.status() >= 400) bad.push(`HTTP ${r.status()} ${r.url()}`); });
            page.on('requestfailed', r => bad.push(`FAILED ${r.url()} :: ${r.failure() && r.failure().errorText}`));

            await page.goto('https://gonzadsgh.github.io/interactive-humanoid/', { waitUntil: 'load' });
            await page.waitForTimeout(3000);
            const boot = await page.evaluate(() => ({
              p5: typeof p5, ml5: typeof ml5, state: APP.state,
              rendererOk: Renderer.ok, shaderError: Renderer.error
            }));
            console.log('BOOT:', JSON.stringify(boot));

            await page.click('#activate');
            await page.waitForTimeout(25000);   // camera + ml5 model download
            const live = await page.evaluate(() => ({
              state: APP.state,
              cameraReady: CameraManager.ready,
              cameraRes: CameraManager.width + 'x' + CameraManager.height,
              videoDisplay: Array.from(document.querySelectorAll('video')).map(v => getComputedStyle(v).display),
              uiHidden: document.getElementById('ui').hidden,
              segmentation: Segmentation.status,
              segmentationError: Segmentation.errorMessage,
              segmentationResults: Segmentation.resultCount,
              faceMesh: FaceAnalysis.status,
              analysisRes: APP.aw + 'x' + APP.ah,
              particles: Particles.total,
              renderFps: +APP.fps.toFixed(1),
              analysisHz: +APP.tick.hz.toFixed(1),
              glError: Renderer.gl.getError()
            }));
            console.log('LIVE:', JSON.stringify(live, null, 1));
            console.log('PROBLEMS:', bad.length ? '\n  ' + bad.join('\n  ') : 'none');
            await browser.close();
            if (!live.cameraReady || live.glError !== 0) process.exit(1);
          })();
          JS
          node check.js
